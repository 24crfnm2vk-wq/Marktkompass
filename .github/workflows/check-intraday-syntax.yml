name: Intraday-VIX – öffentliche Syntaxprüfung

on:
  push:
    branches:
      - feature/intraday-vix-provisional

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Öffentliche JavaScript-Dateien syntaktisch prüfen
        run: |
          node --check app.js
          node --check intraday-vix.js
          node --input-type=module --check < data-updater.js
          node --input-type=module --check < acwi-update.js
